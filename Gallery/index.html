<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masonry WebP Gallery</title>

<style>
  body {
    margin: 0;
    padding: 15px;
    background: #f4f4f4;
    font-family: Arial, sans-serif;
  }

  .masonry {
    column-count: 4;
    column-gap: 15px;
    max-width: 1200px;
    margin: auto;
  }

  .masonry img {
    width: 100%;
    margin-bottom: 15px;
    border-radius: 10px;
    break-inside: avoid;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    display: block;
  }

  .masonry img:hover {
    transform: scale(1.03);
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
  }

  /* Tablet */
  @media (max-width: 1024px) {
    .masonry { column-count: 3; }
  }

  /* Mobile */
  @media (max-width: 768px) {
    .masonry { column-count: 2; }
  }

  /* Small mobile */
  @media (max-width: 480px) {
    .masonry { column-count: 1; }
  }
</style>
</head>

<body>

<div class="masonry">
  <img src="https://github.com/pariflex1/oshi/blob/gh-pages/Gallery/image/1.webp?raw=true" loading="lazy">
