  h2 {
    text-align: center;
    margin-bottom: 20px;
  }

  .masonry {
    column-count: 4;
    column-gap: 15px;
    max-width: 1200px;
    margin: auto;
  }

  .masonry picture {
    display: block;
    margin-bottom: 15px;
    break-inside: avoid;
  }

  .masonry img {
    width: 100%;
    border-radius: 10px;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .masonry img:hover {
    transform: scale1.03;
    box-shadow: 0 10px 20px rgba0,0,0,0.2;
  }

  @media max-width: 1024px {
    .masonry { column-count: 3; }
  }

  @media max-width: 768px {
    .masonry { column-count: 2; }
  }

  @media max-width: 480px {
    .masonry { column-count: 1; }
